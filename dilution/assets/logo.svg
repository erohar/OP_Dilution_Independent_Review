<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Open Pit SMU Dilution</title>
  <desc>Plan view of an ore zone, as in the app's plan preview: ore cells
    along a narrow vein and the mining blocks (SMUs, 3 x 3 cells) drawn
    around them, each offset one cell from the last. The waste cells
    inside each block are the dilution.</desc>
  <rect x="0" y="0" width="256" height="256" rx="52" fill="#1E1E1E"/>
  <rect x="3" y="3" width="250" height="250" rx="49" fill="none"
    stroke="#3D3A37" stroke-width="6"/>
  <!-- Cell grid inside the blocks (waste cells) -->
  <g fill="none" stroke="#3D3A37" stroke-width="3">
    <rect x="20" y="68" width="24" height="24"/>
    <rect x="20" y="92" width="24" height="24"/>
    <rect x="20" y="116" width="24" height="24"/>
    <rect x="44" y="68" width="24" height="24"/>
    <rect x="44" y="92" width="24" height="24"/>
    <rect x="44" y="116" width="24" height="24"/>
    <rect x="68" y="68" width="24" height="24"/>
    <rect x="68" y="92" width="24" height="24"/>
    <rect x="68" y="116" width="24" height="24"/>
    <rect x="92" y="92" width="24" height="24"/>
    <rect x="92" y="116" width="24" height="24"/>
    <rect x="92" y="140" width="24" height="24"/>
    <rect x="116" y="92" width="24" height="24"/>
    <rect x="116" y="116" width="24" height="24"/>
    <rect x="116" y="140" width="24" height="24"/>
    <rect x="140" y="92" width="24" height="24"/>
    <rect x="140" y="116" width="24" height="24"/>
    <rect x="140" y="140" width="24" height="24"/>
    <rect x="164" y="116" width="24" height="24"/>
    <rect x="164" y="140" width="24" height="24"/>
    <rect x="164" y="164" width="24" height="24"/>
    <rect x="188" y="116" width="24" height="24"/>
    <rect x="188" y="140" width="24" height="24"/>
    <rect x="188" y="164" width="24" height="24"/>
    <rect x="212" y="116" width="24" height="24"/>
    <rect x="212" y="140" width="24" height="24"/>
    <rect x="212" y="164" width="24" height="24"/>
  </g>
  <!-- Ore cells (in situ ore above cut-off) -->
  <g fill="#743929" stroke="#C37529" stroke-width="3">
    <rect x="20" y="92" width="24" height="24"/>
    <rect x="44" y="92" width="24" height="24"/>
    <rect x="68" y="92" width="24" height="24"/>
    <rect x="44" y="116" width="24" height="24"/>
    <rect x="68" y="116" width="24" height="24"/>
    <rect x="92" y="116" width="24" height="24"/>
    <rect x="116" y="116" width="24" height="24"/>
    <rect x="116" y="140" width="24" height="24"/>
    <rect x="140" y="140" width="24" height="24"/>
    <rect x="164" y="140" width="24" height="24"/>
    <rect x="188" y="140" width="24" height="24"/>
    <rect x="212" y="140" width="24" height="24"/>
    <rect x="188" y="164" width="24" height="24"/>
  </g>
  <!-- Mining blocks: the ore plus the waste they dilute it with -->
  <g fill="none" stroke="#DCA91F" stroke-width="9" stroke-linejoin="round">
    <rect x="20" y="68" width="72" height="72"/>
    <rect x="92" y="92" width="72" height="72"/>
    <rect x="164" y="116" width="72" height="72"/>
  </g>
</svg>
